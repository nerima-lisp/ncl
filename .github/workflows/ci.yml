name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.name == 'x86-64 macOS' && 'Prepare test archive (x86-64 macOS)' || format('Check and test ({0})', matrix.name) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Linux
            runner: ubuntu-24.04
          - name: aarch64 Linux
            runner: ubuntu-24.04-arm
          - name: arm64 macOS
            runner: macos-15
          - name: x86-64 macOS
            runner: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check added Rust lines
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          else
            git fetch --no-tags origin "$BASE_SHA"
          fi
          python3 scripts/check_added_lines.py --base "$BASE_SHA"
      - name: Verify toolchain version consistency
        run: |
          set -euo pipefail
          expected="$(grep -m1 '^channel' rust-toolchain.toml | perl -pe 's/channel = "(.*)"/\1/')"
          tool_versions="$(grep -m1 '^rust ' .tool-versions | perl -lane 'print $F[1]')"
          cargo_toml="$(grep -m1 '^rust-version' Cargo.toml | perl -pe 's/.*"(.*)".*/\1/')"
          flake_versions="$(grep -o 'rust-bin\.stable\."[0-9.]*"' flake.nix | perl -pe 's/.*"(.*)"/\1/' | sort -u)"
          ci_versions="$(grep -A2 '^ *- uses: dtolnay/rust-toolchain@stable' .github/workflows/ci.yml | grep 'toolchain:' | perl -lane 'print $F[1]' | sort -u)"
          fail=0
          if [ "$tool_versions" != "$expected" ]; then
            echo "::error::.tool-versions rust=$tool_versions does not match rust-toolchain.toml channel=$expected"
            fail=1
          fi
          if [ "${expected%.*}" != "$cargo_toml" ]; then
            echo "::error::Cargo.toml rust-version=$cargo_toml does not match rust-toolchain.toml channel=$expected (expected prefix ${expected%.*})"
            fail=1
          fi
          if [ "$(printf '%s\n' "$flake_versions" | wc -l | tr -d ' ')" != "1" ] || [ "$flake_versions" != "$expected" ]; then
            echo "::error::flake.nix rust-bin version(s) [$flake_versions] do not all match rust-toolchain.toml channel=$expected"
            fail=1
          fi
          if [ "$(printf '%s\n' "$ci_versions" | wc -l | tr -d ' ')" != "1" ] || [ "$ci_versions" != "$expected" ]; then
            echo "::error::ci.yml dtolnay/rust-toolchain toolchain(s) [$ci_versions] do not all match rust-toolchain.toml channel=$expected"
            fail=1
          fi
          exit $fail
      - run: python3 scripts/reachability.py --self-test
      - run: python3 scripts/reachability.py
      - run: python3 scripts/check_standards.py
      - run: python3 conformance/ownership/check.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-workspace-crates: true
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - name: Run nextest tests
        if: matrix.name != 'x86-64 macOS'
        run: cargo nextest run --locked --workspace --all-features --all-targets --no-tests=fail
      - name: Build nextest archive
        if: matrix.name == 'x86-64 macOS'
        run: cargo nextest archive --locked --workspace --all-features --all-targets --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
      - name: Upload nextest archive
        if: matrix.name == 'x86-64 macOS'
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-x86-64-macos
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          if-no-files-found: error
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  x86-64-macos-test-shard:
    name: x86-64 macOS test shard ${{ matrix.shard }}/2
    runs-on: macos-15-intel
    needs: check
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive-x86-64-macos
          path: ${{ runner.temp }}/nextest
      - name: Run nextest shard
        run: cargo nextest run --archive-file "$RUNNER_TEMP/nextest/nextest-archive.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --partition "hash:${{ matrix.shard }}/2" --no-tests=fail

  x86-64-macos-test-result:
    name: Check and test (x86-64 macOS)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [check, x86-64-macos-test-shard]
    steps:
      - name: Require checks and both test shards to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SHARD_RESULT: ${{ needs.x86-64-macos-test-shard.result }}
        run: |
          set -euo pipefail
          if [ "$CHECK_RESULT" != success ] || [ "$SHARD_RESULT" != success ]; then
            echo "Check job result: $CHECK_RESULT"
            echo "Test shard result: $SHARD_RESULT"
            exit 1
          fi

  release-check:
    name: Release check (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Linux
            runner: ubuntu-24.04
          - name: arm64 macOS
            runner: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # Build first to warm the incremental cache for the release tests below.
      - run: cargo build --locked --workspace --release
      - name: Smoke test cl-bench GC load on aarch64 macOS
        if: matrix.name == 'aarch64 macOS'
        shell: bash
        run: |
          set -euo pipefail
          output=$(target/release/ncl --load tests/fixtures/clbench_gc_load.lisp)
          test "$output" = 42
      - run: cargo nextest run --locked --workspace --all-features --all-targets --release --no-tests=fail

  gc-stress:
    name: GC stress and strict forwarding
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run GC stress tests
        run: cargo test --locked --workspace --all-features --all-targets gc_stress -- --nocapture
      - name: Run strict forwarding tests
        run: cargo test --locked --workspace --all-features --all-targets strict_forwarding -- --nocapture

  release-smoke:
    name: Release smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Exercise release CLI
        shell: bash
        run: |
          set -euo pipefail
          eval_literal="$(target/release/ncl --eval '42')"
          test "$eval_literal" = 42
          eval_add="$(target/release/ncl --eval '(+ 1 2)')"
          test "$eval_add" = 3
          load_file="$RUNNER_TEMP/ncl-release-smoke.lisp"
          printf '43\n' > "$load_file"
          loaded="$(target/release/ncl --load "$load_file")"
          test "$loaded" = 43
      # These features are currently covered by the native pipeline tests rather
      # than the CLI, because nested functions are not publishable yet.
      - run: cargo test --locked --release -p ncl-codegen executes_recursive_fib_twenty_five -- --exact
      - run: cargo test --locked --release -p ncl-compiler-front lowers_lambda_to_function_entry_closure_and_closure_call -- --exact
      - run: cargo test --locked --release -p ncl-compiler-front lowers_catch_throw_with_a_handler_region -- --exact

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix flake check --all-systems --no-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
      - run: nix develop --command mkdocs build --strict --config-file docs/mkdocs.yml

  nix-default:
    name: Nix check (default, x86-64 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.sha }}-default
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix build --no-link .#checks.x86_64-linux.default

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # Region coverage keeps untaken branches visible. The 95% workspace
      # figure is a reported goal; changed source paths use the blocking ratchet below.
      - run: cargo llvm-cov clean --locked --workspace
      - run: cargo llvm-cov --locked --workspace --all-features --all-targets --no-report nextest --no-tests=fail
      - run: cargo llvm-cov report --locked --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      - run: cargo llvm-cov report --locked --workspace --json --summary-only --output-path coverage-summary.json
      - name: Summarize region coverage
        if: always()
        run: |
          set -euo pipefail
          if [ -s coverage-summary.json ]; then
            jq -r '"Workspace regions: \(.data[0].totals.regions.covered)/\(.data[0].totals.regions.count) (\(.data[0].totals.regions.percent)%; 95.00% goal)"' coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
            if jq -e '.data[0].totals.regions.percent < 95.0' coverage-summary.json >/dev/null; then
              percent="$(jq -r '.data[0].totals.regions.percent' coverage-summary.json)"
              echo "::warning title=Workspace coverage goal::Region coverage is ${percent}%; the goal is 95.00%."
            fi
          else
            echo "Workspace regions: summary unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Find changed paths from merge base
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        id: coverage_paths
        env:
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PATHS_FILE: ${{ runner.temp }}/coverage-changed-paths
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            git fetch --no-tags origin "$PR_BASE_SHA"
            base_sha="$PR_BASE_SHA"
          else
            git fetch --no-tags origin "$BASE_BRANCH"
            base_sha="$(git rev-parse FETCH_HEAD)"
          fi
          merge_base="$(git merge-base HEAD "$base_sha")"
          git diff --no-ext-diff --name-status --find-renames -z "$merge_base" HEAD > "$PATHS_FILE"
          printf 'merge_base=%s\n' "$merge_base" >> "$GITHUB_OUTPUT"
          printf 'paths_file=%s\n' "$PATHS_FILE" >> "$GITHUB_OUTPUT"
      - name: Find parent coverage artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        id: coverage_parent
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
          MERGE_BASE: ${{ steps.coverage_paths.outputs.merge_base }}
          ARTIFACTS_FILE: ${{ runner.temp }}/coverage-artifacts.json
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=coverage-summary&per_page=100" \
            > "$ARTIFACTS_FILE"
          python3 scripts/find_parent_coverage.py \
            --merge-base "$MERGE_BASE" \
            --base-branch "$BASE_BRANCH" \
            --artifacts "$ARTIFACTS_FILE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record parent coverage baseline
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          PARENT_SHA: ${{ steps.coverage_parent.outputs.sha }}
          FALLBACK: ${{ steps.coverage_parent.outputs.fallback }}
        run: |
          set -euo pipefail
          baseline_note="exact merge-base"
          if [[ "$FALLBACK" == "true" ]]; then
            baseline_note="nearest ancestor with an available artifact"
          fi
          printf 'Parent coverage baseline: %s (%s).\n' "$PARENT_SHA" "$baseline_note" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        with:
          name: coverage-summary
          run-id: ${{ steps.coverage_parent.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/coverage-parent
      - name: Check changed-path coverage
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          PATHS_FILE: ${{ steps.coverage_paths.outputs.paths_file }}
          PARENT_SUMMARY: ${{ runner.temp }}/coverage-parent/coverage-summary.json
        run: |
          set -euo pipefail
          python3 scripts/check_changed_path_coverage.py \
            --candidate coverage-summary.json \
            --parent "$PARENT_SUMMARY" \
            --changed-paths "$PATHS_FILE" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary.json
          if-no-files-found: warn

  security:
    # cargo audit scans every dependency reachable via Cargo.lock, which includes
    # dev-only dependencies (e.g. criterion) alongside release-binary dependencies.
    name: Dependency audit (full lockfile, incl. dev-only deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
