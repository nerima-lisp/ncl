name: R2 x86 sandbox diagnostics

on:
  push:
    branches:
      - codex/r2-x86-sandbox-diag-20261024

permissions:
  contents: read

jobs:
  diagnose:
    name: x86 e2enum release diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all e2enum cases in x86 release sandbox
        run: |
          echo "revision=${{ github.sha }}"
          nix build -L .#checks.x86_64-linux.e2enum-diagnostic
