name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
      - name: Resolve package version and check release ref
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import os
          import sys

          root_manifest = os.path.join(os.environ["GITHUB_WORKSPACE"], "Cargo.toml")
          packages = [
              package
              for package in json.load(sys.stdin)["packages"]
              if package["name"] == "ncl" and package["manifest_path"] == root_manifest
          ]
          if len(packages) != 1:
              raise SystemExit("expected exactly one root ncl package")
          print(packages[0]["version"])
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]] && ! awk -v version="$version" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found = 1 }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Build, test, and smoke test
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$host_target" != "$RELEASE_TARGET" ]]; then
            echo "::error::runner target $host_target does not match $RELEASE_TARGET"
            exit 1
          fi
          cargo build --locked --workspace --release
          cargo test --locked --workspace --all-features --all-targets --release
          version_output="$(target/release/ncl --version)"
          printf '%s\n' "$version_output"
          [[ "$version_output" == *"$RELEASE_VERSION"* ]]
          eval_literal="$(target/release/ncl --eval '42')"
          [[ "$eval_literal" == 42 ]]
          eval_add="$(target/release/ncl --eval '(+ 1 2)')"
          [[ "$eval_add" == 3 ]]
          load_file="$RUNNER_TEMP/ncl-release-smoke.lisp"
          printf '43\n' > "$load_file"
          loaded="$(target/release/ncl --load "$load_file")"
          [[ "$loaded" == 43 ]]
          mkdir -p dist
          archive="dist/ncl-v${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          checksum="$archive.sha256"
          tar -C target/release -czf "$archive" ncl
          (
            cd dist
            archive_name="$(basename "$archive")"
            checksum_name="$(basename "$checksum")"
            shasum -a 256 "$archive_name" > "$checksum_name"
            shasum -a 256 -c "./$checksum_name"
          )
          test -s "$archive"
          test -s "$checksum"
          ls -lh "$archive" "$checksum"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ncl-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Verify release assets and prepare notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          files=(dist/*)
          if [[ ${#files[@]} -ne 8 ]]; then
            echo "::error::expected four archives and four checksum files, found ${#files[@]} files"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          expected_targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
          )
          for target in "${expected_targets[@]}"; do
            archive="dist/ncl-v${version}-${target}.tar.gz"
            checksum="$archive.sha256"
            if [[ ! -s "$archive" || ! -s "$checksum" ]]; then
              echo "::error::missing release archive or checksum for $target"
              exit 1
            fi
          done
          (cd dist && shasum -a 256 -c ./*.sha256)
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            !found && ($0 == "## [" version "]" || index($0, "## [" version "] - ") == 1) { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if ! grep -Eq '[^[:space:]]' "$notes_file"; then
            echo "::error::CHANGELOG.md has no non-empty release notes for $version"
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.release.outputs.notes_file }}"
