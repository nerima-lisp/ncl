name: Conformance scoreboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoreboard:
    name: Measure ansi-test and cl-bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Build NCL
        run: cargo build --locked --release
      - name: Run scoreboard harness
        run: |
          mkdir -p conformance/scoreboard
          python3 scripts/conformance_scoreboard.py \
            --cache-dir "$RUNNER_TEMP/ncl-conformance" \
            --ansi-command "${GITHUB_WORKSPACE}/target/release/ncl --load doit.lsp" \
            --cl-bench-command "${GITHUB_WORKSPACE}/target/release/ncl --load tests.lisp" \
            --output "conformance/scoreboard/$(date -u +%F)-${GITHUB_SHA}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-scoreboard
          path: conformance/scoreboard/
          if-no-files-found: warn
