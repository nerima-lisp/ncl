name: Conformance scoreboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoreboard:
    name: Measure ansi-test and cl-bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build NCL
        run: cargo build --locked --release
      - name: Run scoreboard harness
        run: |
          mkdir -p conformance/scoreboard
          python3 scripts/conformance_scoreboard.py \
            --cache-dir "$RUNNER_TEMP/ncl-conformance" \
            --ansi-command "python3 ${GITHUB_WORKSPACE}/scripts/ansi_test_runner.py --ncl ${GITHUB_WORKSPACE}/target/release/ncl --ansi-dir . --timeout 30 --workers 4" \
            --cl-bench-command "sh ${GITHUB_WORKSPACE}/conformance/cl-bench/ncl-driver.sh ${GITHUB_WORKSPACE}/target/release/ncl" \
            --output "conformance/scoreboard/$(date -u +%F)-${GITHUB_SHA}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-scoreboard
          path: conformance/scoreboard/
          if-no-files-found: warn
