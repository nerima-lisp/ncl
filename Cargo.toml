[workspace]
resolver = "3"
members = [
    ".",
    "packages/asm/x86-64",
    "packages/ir",
    "packages/codegen",
    "packages/asm/aarch64",
    "packages/sys",
    "packages/object",
    "packages/objfile",
    "packages/ownership",
    "packages/types",
    "packages/reader",
    "packages/printer",
    "packages/conditions",
    "packages/clos",
    "packages/compiler/front",
    "packages/lib/numbers",
    "packages/lib/sequences",
    "packages/lib/strings",
    "packages/lib/hash-arrays",
    "packages/lib/streams",
    "packages/lib/pathnames",
    "packages/lib/packages",
    "packages/lib/format",
    "packages/lib/macros",
    "packages/stdlib",
    "packages/threads",
    "packages/ffi",
    "packages/image",
    "packages/runtime",
    "packages/conformance",
]
default-members = [
    ".",
    "packages/asm/x86-64",
    "packages/ir",
    "packages/codegen",
    "packages/asm/aarch64",
    "packages/sys",
    "packages/object",
    "packages/objfile",
    "packages/ownership",
    "packages/types",
    "packages/reader",
    "packages/printer",
    "packages/conditions",
    "packages/clos",
    "packages/compiler/front",
    "packages/lib/numbers",
    "packages/lib/sequences",
    "packages/lib/strings",
    "packages/lib/hash-arrays",
    "packages/lib/streams",
    "packages/lib/pathnames",
    "packages/lib/packages",
    "packages/lib/format",
    "packages/lib/macros",
    "packages/stdlib",
    "packages/threads",
    "packages/ffi",
    "packages/image",
    "packages/runtime",
    "packages/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[package]
name = "ncl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust-native Common Lisp runtime"
license.workspace = true

[dependencies]
ncl-runtime = { path = "packages/runtime" }

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
