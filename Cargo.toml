[workspace]
resolver = "2"
members = [
    ".",
    "packages/core/syntax",
    "packages/core/compiler",
    "packages/core/runtime",
]
default-members = [
    ".",
    "packages/core/syntax",
    "packages/core/compiler",
    "packages/core/runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "ncl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust-native Common Lisp runtime"
license.workspace = true

[lints]
workspace = true

[dependencies]
ncl-runtime = { path = "packages/core/runtime" }
ncl-syntax = { path = "packages/core/syntax" }
