[package]
name = "ncl-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Common Lisp-oriented runtime and evaluator for ncl"
license.workspace = true

[lints]
workspace = true

[dependencies]
ibig = { version = "0.3.6", default-features = false, features = ["std"] }
ncl-compiler = { path = "../compiler", version = "0.1.0" }
ncl-syntax = { path = "../syntax", version = "0.1.0" }

[dev-dependencies]
criterion = "0.8.2"
rstest = "0.26.1"

[[bench]]
name = "evaluation"
harness = false
