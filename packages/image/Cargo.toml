[package]
name = "ncl-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ncl-object = { path = "../object" }
ncl-objfile = { path = "../objfile" }
ncl-sys = { path = "../sys" }

[dev-dependencies]
ncl-ownership = { path = "../ownership" }

[lints]
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
indexing_slicing = "deny"
as_conversions = "deny"
wildcard_enum_match_arm = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
