[package]
name = "ncl-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Unsafe platform and heap substrate for NCL"
license.workspace = true

[features]
default = []
test-support = []

[lints]
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
